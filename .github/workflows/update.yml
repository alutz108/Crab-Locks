name: Update Crab Locks data

on:
  schedule:
    # 11:00 UTC = 6 AM Eastern (7 AM in summer): full update
    - cron: "0 11 * * *"
    # 21:30 UTC = 4:30 PM Eastern: NBA and college basketball lines before tonight's games
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = everything, odds = NBA/NFL lines snapshot only, test = print samples and save nothing, archive = one-time college archive import"
        default: "full"
        type: choice
        options: [full, odds, test, archive-test, archive]

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python add-ons
        run: pip install --quiet pyarrow

      - name: Run updater
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PLAYBOOK_API_KEY: ${{ secrets.PLAYBOOK_API_KEY }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 21 * * *' && 'odds' || 'full') }}
        run: |
          case "$MODE" in
            test) python scripts/update.py --test ;;
            archive-test) python scripts/update.py --archive --test --sports NCAAF,NCAAB ;;
            archive) python scripts/update.py --archive --sports NCAAF,NCAAB ;;
            odds) python scripts/update.py --sports NBA,NCAAB --odds-only ;;
            *)    python scripts/update.py ;;
          esac

      - name: Save data
        if: always() && (github.event.inputs.mode || 'full') != 'test' && github.event.inputs.mode != 'archive-test'
        run: |
          git config user.name "crab-locks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          fi
